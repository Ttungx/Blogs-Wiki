name: Update content and deploy Pages

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      run_update:
        description: Run content discovery, translation, and persistence before deployment
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: blogs-wiki-pages
  cancel-in-progress: false

jobs:
  update:
    name: Update repository content
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Decide whether to update
        id: update-mode
        shell: bash
        env:
          UPDATE_REQUESTED: ${{ github.event_name == 'schedule' || inputs.run_update }}
          REF_TYPE: ${{ github.ref_type }}
          HAS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
          HAS_OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL != '' }}
          HAS_TRANSLATION_MODEL: ${{ secrets.TRANSLATION_MODEL != '' }}
        run: |
          enabled=false

          if [[ "$UPDATE_REQUESTED" != "true" ]]; then
            echo "::notice::Content update disabled; this run will only build and deploy."
          elif [[ "$REF_TYPE" != "branch" ]]; then
            echo "::notice::Content update skipped because commits require a branch ref."
          elif [[ "$HAS_OPENAI_API_KEY" != "true" || "$HAS_OPENAI_BASE_URL" != "true" || "$HAS_TRANSLATION_MODEL" != "true" ]]; then
            echo "::notice::Content update skipped because one or more translation secrets are unavailable."
          else
            enabled=true
          fi

          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      - name: Checkout update branch
        if: steps.update-mode.outputs.enabled == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        if: steps.update-mode.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.update-mode.outputs.enabled == 'true'
        run: npm ci

      - name: Run project update
        if: steps.update-mode.outputs.enabled == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          TRANSLATION_MODEL: ${{ secrets.TRANSLATION_MODEL }}
        run: npm run update

      - name: Commit content changes
        if: steps.update-mode.outputs.enabled == 'true'
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No content changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "No staged content changes to commit."
            exit 0
          fi

          git commit -m "chore(content): update collected articles"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Resolve build revision
        id: revision
        shell: bash
        env:
          UPDATE_ENABLED: ${{ steps.update-mode.outputs.enabled }}
        run: |
          sha="$GITHUB_SHA"
          if [[ "$UPDATE_ENABLED" == "true" ]]; then
            sha="$(git rev-parse HEAD)"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build site and Pagefind index
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout build revision
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.update.outputs.commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Astro site and Pagefind index
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
