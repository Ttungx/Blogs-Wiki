name: 内容更新 (content-update)

on:
  schedule:
    # 每日 02:17 UTC（原 CI 时刻）。
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: 单个来源 id（留空 = 全部 active 来源）
        required: false
        type: string
      limit:
        description: 每源最大新文章数（0 = 不限，默认 3）
        required: false
        type: number
        default: 3
      dry-run:
        description: 只发现 + 抓取，不调用翻译模型、不写文章文件（仍生成审计报告）
        required: false
        type: boolean
        default: false

concurrency:
  group: content-update
  cancel-in-progress: false

permissions:
  # 本流水线只读代码 + 运行更新；不提交任何文件（文章正文不入 git）。
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # vars.TRANSLATION_PROVIDER=paid 时回退付费 secrets；默认 free。
      TRANSLATION_PROVIDER: ${{ vars.TRANSLATION_PROVIDER || 'free' }}
      # 以下经仓库 Variables 配置；未设置时使用 CLI 默认值。
      TRANSLATION_PIPELINE: ${{ vars.TRANSLATION_PIPELINE }}
      FETCH_BACKEND: ${{ vars.FETCH_BACKEND }}
      # GitHub Actions 只生成本地文件，再通过同步 API 写入 D1。
      # 固定使用 file，避免仓库 Variables 误配为 d1 后 Node CLI 启动失败。
      STORAGE_BACKEND: file
      USE_PROXY: ${{ vars.USE_PROXY }}
      PROXY_URL: ${{ vars.PROXY_URL }}
      NO_PROXY: ${{ vars.NO_PROXY }}
      CONTENT_SYNC_URL: ${{ vars.CONTENT_SYNC_URL }}
      CONTENT_SYNC_TOKEN: ${{ secrets.CONTENT_SYNC_TOKEN }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      # opencode-free 免费层经 ocx（OpenAI 兼容网关，loopback 免认证）接入。
      # 注意：ocx provider add 只写磁盘 config，不更新运行中进程，必须先 add 再 start。
      # 不用 `ocx ready --wait`：runner 上无 Codex catalog 时 ready 恒为 false
      # （"sync failed"），改用端口轮询 /v1/models。
      - name: 启动 opencodex 免费通道
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs['dry-run'] != true) && (vars.TRANSLATION_PROVIDER || 'free') == 'free' }}
        shell: bash
        run: |
          npm install -g @bitkyc08/opencodex
          ocx provider add opencode-free
          nohup ocx start --port 10367 > /tmp/ocx.log 2>&1 &
          echo "ocx pid: $!"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:10367/v1/models || true)
            echo "poll $i: HTTP $code"
            [[ "$code" = "200" ]] && exit 0
            sleep 2
          done
          echo "ocx 网关未就绪；日志："
          tail -40 /tmp/ocx.log || true
          exit 1

      - name: 配置翻译通道（free 默认，paid 回退）
        if: ${{ github.event_name != 'workflow_dispatch' || inputs['dry-run'] != true }}
        shell: bash
        env:
          PAID_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PAID_OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          PAID_TRANSLATION_MODEL: ${{ secrets.TRANSLATION_MODEL }}
        run: |
          if [[ "$TRANSLATION_PROVIDER" == "paid" ]]; then
            echo "OPENAI_API_KEY=${PAID_OPENAI_API_KEY}" >> "$GITHUB_ENV"
            echo "OPENAI_BASE_URL=${PAID_OPENAI_BASE_URL}" >> "$GITHUB_ENV"
            echo "TRANSLATION_MODEL=${PAID_TRANSLATION_MODEL}" >> "$GITHUB_ENV"
            echo "::notice::翻译通道：paid（secrets）"
          else
            echo "OPENAI_API_KEY=opencodex-loopback" >> "$GITHUB_ENV"
            echo "OPENAI_BASE_URL=http://127.0.0.1:10367/v1" >> "$GITHUB_ENV"
            # 模型名必须带 -free 后缀（runner 实测：无后缀走错 auth 路径 → 401 Missing API key）
            echo "TRANSLATION_MODEL=opencode-free/deepseek-v4-flash-free" >> "$GITHUB_ENV"
            echo "MODEL_REASONING_EFFORT=${{ vars.MODEL_REASONING_EFFORT || 'low' }}" >> "$GITHUB_ENV"
            echo "::notice::翻译通道：opencode-free/deepseek-v4-flash-free（reasoning_effort=${{ vars.MODEL_REASONING_EFFORT || 'low' }}，经 ocx 网关）"
          fi

      - name: 运行内容更新
        id: update
        env:
          INPUT_SOURCE: ${{ inputs.source }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_DRY_RUN: ${{ inputs['dry-run'] }}
          REPORT_DIR: ${{ github.workspace }}/.update-report
        run: |
          set -euo pipefail
          args=()
          if [ -n "$INPUT_SOURCE" ]; then
            args+=(--source "$INPUT_SOURCE")
          fi
          if [ -n "$INPUT_LIMIT" ]; then
            args+=(--limit "$INPUT_LIMIT")
          fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          npm run update -- "${args[@]}" --report "$REPORT_DIR"

      - name: 写入 job summary
        if: always()
        run: |
          if [ -f "${{ github.workspace }}/.update-report/report.md" ]; then
            cat "${{ github.workspace }}/.update-report/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 上传可审计报告 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-update-report
          path: .update-report
          if-no-files-found: error
          retention-days: 7

      - name: 生成 D1 同步载荷
        if: ${{ github.event_name != 'workflow_dispatch' || inputs['dry-run'] != true }}
        run: |
          set -euo pipefail
          node scripts/import-local-articles.mjs --json --output .tmp-import-articles.json
          test -s .tmp-import-articles.json

      - name: 同步文章到线上 D1
        if: ${{ github.event_name != 'workflow_dispatch' || inputs['dry-run'] != true }}
        env:
          CONTENT_SYNC_URL: ${{ vars.CONTENT_SYNC_URL }}
          CONTENT_SYNC_TOKEN: ${{ secrets.CONTENT_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CONTENT_SYNC_URL"
          test -n "$CONTENT_SYNC_TOKEN"
          node scripts/sync-local-articles.mjs --input .tmp-import-articles.json

      - name: 停止 opencodex
        if: always() && (vars.TRANSLATION_PROVIDER || 'free') == 'free'
        shell: bash
        run: |
          pkill -f "ocx start" || true

      - name: 清理正文临时文件
        if: always()
        run: rm -f .tmp-import-articles.json .tmp-import-articles.sql
