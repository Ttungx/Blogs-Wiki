# Render 部署配置 —— 内容更新 runner（免费 Web Service）。
#
# 架构：CF Worker Cron（每小时 :07）--ping /run--> 本服务执行单源更新链
#       （update → import-local-articles → content-sync）--> D1。
# 重活跑在这里的真实 Node 环境，绕开 Workers 免费版 10ms CPU 限制。
#
# 部署方式（二选一）：
#   A. Render Dashboard → New + → Blueprint → 连接本仓库（自动读本文件）
#   B. CLI: render blueprint launch
#
# 首次部署需在 Dashboard 手填 sync:false 的环境变量：
#   RUNNER_KEY          与 CF Worker 的 CONTENT_SYNC_TOKEN 同值
#   CONTENT_SYNC_TOKEN  同上（管线写 D1 用）
#   OPENAI_API_KEY / OPENAI_BASE_URL / TRANSLATION_MODEL   翻译网关
#
# 部署完成后：把服务域名（如 https://blogs-wiki-updater.onrender.com）
# 填入 CF Worker 的 RUNNER_URL 变量（wrangler.deploy.jsonc vars 或 Dashboard）。

services:
  - type: web
    name: blogs-wiki-updater
    runtime: node
    plan: free
    healthCheckPath: /healthz
    buildCommand: npm ci
    startCommand: node scripts/render-runner.mjs
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: CONTENT_SYNC_URL
        value: "https://blogswiki.dpdns.org/api/content-sync/"
      - key: CONTENT_SYNC_CHECK_URL
        value: "https://blogswiki.dpdns.org/api/content-sync/check/"
      - key: MODEL_REASONING_EFFORT
        value: low
      # 每源每轮抓取篇数。默认 3 篇在 7 小时/源的轮转节奏下吞吐过低：
      # 高频源（openai/anthropic 等）一天的新文可能超过 3 篇，又恰逢抓取
      # 失败就会整轮空转。提到 5 篇后按 D1 写入预算估算约 700 篇/天，
      # 远低于 9 万行/天的警戒线（docs/d1-write-budget.md）。
      - key: UPDATE_LIMIT
        value: "5"
      # 每轮从 D1 补翻的「有原文缺中译」文章数（0 = 关闭）。
      - key: TRANSLATE_BACKLOG_LIMIT
        value: "2"
      # node 后端抽出过短正文时回退 Defuddle 的阈值（字符）。
      - key: FETCH_FALLBACK_MIN_CHARS
        value: "200"
      - key: RUNNER_KEY
        sync: false
      - key: CONTENT_SYNC_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: TRANSLATION_MODEL
        sync: false
      # 翻译提供商注册表（2026-09-09 起统一遵从 model_provider.yaml）：
      # 该文件敏感已 gitignore，Render 容器拿不到，两种注入方式二选一：
      #   A. MODEL_PROVIDER_YAML —— 在 dashboard 把 model_provider.yaml 全文
      #      贴进这个环境变量（推荐，重启不丢）；
      #   B. MODEL_PROVIDER_FILE —— 配合 Render Secret Files 把文件挂到
      #      容器内路径（如 /etc/secrets/model_provider.yaml），此变量填该路径。
      # 设置任一变量后，AI_PROVIDER* 槽位链与平铺变量即被忽略（所有翻译
      # 入口——update 内联 / translate:batch / translate:backlog——统一走
      # 注册表的 priority 链，含 rate_limit 与 expire 自动剔除）。
      - key: MODEL_PROVIDER_YAML
        sync: false
